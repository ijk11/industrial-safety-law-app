<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e6b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현황판">
<title>산안법 조문 찾기 — 현황판</title>
<style>
:root{
  --ground:#f7f8f6; --surface:#ffffff; --surface-2:#eef1ee;
  --ink:#12171a; --ink-2:#4a554e; --ink-3:#78837c;
  --line:#dde3de; --line-2:#c9d2cb;
  --accent:#0e6b45; --accent-ink:#ffffff; --accent-soft:#e2efe8;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0f1412; --surface:#161c19; --surface-2:#1d2521;
    --ink:#e7ede9; --ink-2:#a3b0a8; --ink-3:#7e8b84;
    --line:#26302b; --line-2:#33403a;
    --accent:#4fcf97; --accent-ink:#08140e; --accent-soft:#1a2b23;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin:0 0 18px}
/* 앱과 같은 초록이되 표는 다르게 — 홈 화면에 나란히 두었을 때 한눈에 갈라져야 한다.
   막대 셋은 아래 그래프와 맞물리고, 획이 굵어 28px 로 줄어도 뭉개지지 않는다. */
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:none}
.mark svg{width:17px;height:17px}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.when{margin-left:auto;font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.4}
button{font:inherit;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);
  color:var(--ink-2);padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
button:hover{background:var(--surface-2)}

.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
/* 숫자마다 한계가 다르다. 눌러야 나오게 두되, 눌러 볼 것이 있다는 표는 남긴다 */
.big button{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:13px 12px;color:var(--ink)}
.big button.on{border-color:var(--accent)}
.big .n{display:block;font-size:26px;font-weight:700;line-height:1.15;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big .k{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);
  line-height:1.45;word-break:keep-all}
.big .lead .n{color:var(--accent)}
.big button.on .k{color:var(--accent)}
.tip{margin:0 0 22px;padding:12px 14px;background:var(--surface-2);border-radius:11px;
  font-size:12px;line-height:1.8;color:var(--ink-2)}
.tip[hidden]{display:none}
.tip b{color:var(--ink);font-weight:700}
.i{width:19px;height:19px;padding:0;border-radius:50%;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-3);font-size:11px;font-weight:700;
  line-height:1;vertical-align:2px;margin-left:5px}
.i.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

h2{margin:0 0 9px;font-size:13px;font-weight:700;color:var(--accent)}
section{margin:0 0 22px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 13px}
.row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .d{width:6.4em;flex:none;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.row .v{width:3.1em;flex:none;text-align:right;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums}
.row .b{flex:1;min-width:0;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.row .b i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.row.today .d{color:var(--accent);font-weight:700}
.row .name .tag{margin-left:7px;padding:1px 6px;border-radius:5px;background:var(--accent);
  color:var(--accent-ink);font-family:inherit;font-size:10.5px;font-weight:700;vertical-align:1px}
.row .name{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace}

.sum{margin:9px 2px 0;font-size:12px;color:var(--ink-3);line-height:1.7}
.note{margin:22px 0 0;padding:12px 14px;background:var(--surface-2);border-radius:11px;
  font-size:11.5px;line-height:1.8;color:var(--ink-3)}
.note b{color:var(--ink-2);font-weight:700}
.note ul{margin:5px 0 0;padding-left:16px}
.msg{padding:26px 4px;text-align:center;color:var(--ink-3);font-size:13px}
</style>
</head>
<body>
<main>
  <header>
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 19V13M12 19V7M19 19V10"/></svg></div>
    <h1>현황판</h1>
    <div class="when" id="when"></div>
    <button id="again">새로고침</button>
  </header>
  <div id="out"><div class="msg">읽는 중…</div></div>
</main>

<script>
"use strict";
/* 앱이 올려 둔 숫자를 그대로 읽어 보여 준다. 이 쪽에서는 아무것도 쓰지 않는다.
   읽기는 인증이 필요 없다 — 규칙이 stats 의 숫자를 1씩 올리는 것과 읽기만 허용한다. */
var PROJECT = "industrial-safety-law-app";
var KEY = "AIzaSyBYl4dZZvZCIFwQ2ybgDh_plwj6VO4IL6M";
var URL_ = "https://firestore.googleapis.com/v1/projects/" + PROJECT +
  "/databases/(default)/documents/stats?key=" + KEY + "&pageSize=300";

/* 계수기를 붙이던 날이라 내가 돌린 검사와 CI 가 통째로 섞였다. 규칙이 삭제를 막아
   두어 지울 수 없으므로 여기서 빼고 본다. 남겨 두면 눈이 매번 그 막대에 끌린다. */
var DIRTY = ["2026-09-04"];

var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
};

/* 앱은 한국 시각으로 날짜를 끊는다. 여기서도 같게 끊어야 "오늘"이 어긋나지 않는다 */
function todayKST() {
  return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
}

/* 숫자마다 무엇을 세고 무엇을 못 세는지가 다르다. 하나로 뭉뚱그린 주석을 밑에 달면
   어느 숫자를 두고 하는 말인지 흐려져, 결국 아무도 읽지 않는다. */
var TIP = {
  dev: "<b>이 기기에서 처음 열었을 때 한 번</b>만 셉니다. 브라우저마다 저장이 따로라, " +
    "같은 휴대폰이어도 카카오톡 안에서 열고 사파리로 또 열면 2가 됩니다. " +
    "사생활 보호 모드는 창을 닫으면 저장이 지워져, 다시 열면 새 기기로 셉니다. " +
    "브라우저 자료를 지워도 마찬가지입니다. <b>사람 수보다 부풀기 쉽습니다.</b>",
  inst: "<b>홈 화면 아이콘으로 처음 열었을 때</b> 한 번 셉니다. 안드로이드와 아이폰 모두 잡습니다. " +
    "추가해 두기만 하고 열지 않으면 그때는 세지 않고, 처음 여는 때에 셉니다. " +
    "지나가며 한 번 열어 본 사람도, 만들며 돌리는 검사용 브라우저도 여기에는 들어오지 않습니다. " +
    "<b>세 숫자 가운데 가장 믿을 만합니다.</b>",
  today: "한 기기가 하루에 여러 번 열어도 <b>한 번만</b> 셉니다. 날짜는 한국 시각으로 끊습니다. " +
    "신호가 없어 보내지 못하면 적어 두지 않으므로, 그날 안에 다시 열면 그때 셉니다. " +
    "브라우저를 갈아 열면 따로 셉니다.",
  daily: "그날 앱을 연 <b>기기</b> 수입니다. 사람 수가 아니며, 같은 기기가 여러 날 열면 날마다 셉니다. " +
    "만들면서 여는 것(localhost)과 CI 는 세지 않습니다. " +
    "계수기를 붙인 2026-09-04 은 검사가 섞여 아예 빼 두었습니다.",
  ver: "그 판을 <b>만난</b> 기기 수입니다. 갈아탄 기기뿐 아니라 <b>처음 온 기기도 들어갑니다.</b> " +
    "맨 처음 여는 순간과 갈아타는 중에는 판이 정해지지 않아 건너뛰고 다음에 열 때 잡으므로, " +
    "「한 번이라도 연 기기」보다 늘 조금 뒤처집니다."
};

function card(n, k, key, lead) {
  return '<button data-tip="' + key + '" aria-expanded="false"' + (lead ? ' class="lead"' : "") +
    '><span class="n">' + n.toLocaleString() + '</span><span class="k">' + k + "</span></button>";
}

/* 제목 옆의 물음표. 표를 눌러야 무엇을 못 세는지가 나온다 */
function head(title, key) {
  return "<h2>" + title + '<button class="i" data-tip="' + key + '" aria-expanded="false"' +
    ' aria-label="이 숫자의 한계">i</button></h2><div class="tip" hidden>' + TIP[key] + "</div>";
}

/* 어느 것이 지금 판인지는 같은 자리에 놓인 sw.js 가 안다. 손으로 적어 두면 틀린다 */
function nowVer() {
  return fetch("sw.js", { cache: "no-store" })
    .then(function (r) { return r.text(); })
    .then(function (t) { return (t.match(/osh-[0-9a-f]+/) || [])[0] || ""; })
    .catch(function () { return ""; });
}

function draw(docs, now) {
  var daily = {}, vers = {}, one = { devices: 0, install: 0 };
  docs.forEach(function (d) {
    var name = d.name.split("/").pop();
    var n = parseInt((((d.fields || {}).n || {}).integerValue) || 0, 10);
    if (one.hasOwnProperty(name)) one[name] = n;
    else if (name.indexOf("daily-") === 0) {
      if (DIRTY.indexOf(name.slice(6)) < 0) daily[name.slice(6)] = n;
    } else if (name.indexOf("ver-") === 0) {
      vers[name.slice(4)] = { n: n, at: d.createTime || "" };
    }
  });

  var today = todayKST();
  var days = Object.keys(daily).sort().reverse();
  var recent = days.slice(0, 30);
  var wide = 1;
  recent.forEach(function (k) { if (daily[k] > wide) wide = daily[k]; });

  var h = '<div class="big">' +
    card(one.devices, "한 번이라도 연 기기", "dev", true) +
    card(one.install, "홈 화면에 설치", "inst") +
    card(daily[today] || 0, "오늘 연 기기", "today") +
    '</div><div class="tip" id="bigtip" hidden></div>';

  h += "<section>" + head("날짜별로 앱을 연 기기", "daily");
  if (!recent.length) h += '<div class="msg">아직 쌓인 날이 없습니다.</div>';
  else {
    h += '<div class="rows">' + recent.map(function (k) {
      return '<div class="row' + (k === today ? " today" : "") + '">' +
        '<div class="d">' + esc(k.slice(5)) + "</div>" +
        '<div class="b"><i style="width:' +
        Math.max(3, Math.round(daily[k] * 100 / wide)) + '%"></i></div>' +
        '<div class="v">' + daily[k] + "</div></div>";
    }).join("") + "</div>";
    var got = 0;
    recent.forEach(function (k) { got += daily[k]; });
    h += '<div class="sum">최근 ' + recent.length + "일 합계 " + got +
      " · 하루 평균 " + (got / recent.length).toFixed(1) +
      " · 집계 시작 " + esc(days[days.length - 1]) + "</div>";
  }
  h += "</section>";

  /* 처음 잡힌 때 순으로 놓는다. 이름이 사람이 읽을 수 있는 것이 아니라 차례가 없으면
     어느 것이 새 판인지 알 길이 없다. */
  var vk = Object.keys(vers).sort(function (a, b) {
    return vers[a].at < vers[b].at ? 1 : vers[a].at > vers[b].at ? -1 : 0;
  });
  if (vk.length) {
    h += "<section>" + head("판마다 쓴 기기", "ver") + '<div class="rows">' +
      vk.map(function (k) {
        return '<div class="row"><div class="name">' + esc(k) +
          (k === now ? '<b class="tag">지금 판</b>' : "") + "</div>" +
          '<div class="v">' + vers[k].n + "</div></div>";
      }).join("") + "</div>" +
      '<div class="sum">새 판이 퍼지는 동안 이미 깔려 있던 기기가 한 대씩 찍힌다.</div></section>';
  }

  h += '<div class="note">보내는 것은 <b>숫자를 올려 달라는 말 한 마디</b>뿐이다. ' +
    "누가·어디서·무엇을 봤는지는 보내지 않고, 기기를 가리는 번호조차 서버로 가지 않는다. " +
    "숫자마다 무엇을 못 세는지는 옆의 <b>i</b> 를 눌러 본다.</div>";

  $("#out").innerHTML = h;

  /* 큰 숫자 셋은 설명 자리를 함께 쓴다. 셋을 동시에 펼치면 그래프가 화면 밖으로 밀린다 */
  var bigtip = $("#bigtip");
  document.querySelectorAll(".big [data-tip]").forEach(function (b) {
    b.onclick = function () {
      var same = b.classList.contains("on");
      document.querySelectorAll(".big [data-tip]").forEach(function (x) {
        x.classList.remove("on"); x.setAttribute("aria-expanded", "false");
      });
      bigtip.hidden = same;
      if (!same) {
        bigtip.innerHTML = TIP[b.dataset.tip];
        b.classList.add("on"); b.setAttribute("aria-expanded", "true");
      }
    };
  });
  /* 제목 옆 물음표는 바로 아래 한 칸만 여닫는다 */
  document.querySelectorAll("h2 .i").forEach(function (b) {
    b.onclick = function () {
      var box = b.parentNode.nextElementSibling;
      box.hidden = !box.hidden;
      b.classList.toggle("on", !box.hidden);
      b.setAttribute("aria-expanded", String(!box.hidden));
    };
  });
}

function load() {
  $("#again").disabled = true;
  Promise.all([fetch(URL_, { cache: "no-store" }).then(function (r) { return r.json(); }), nowVer()])
    .then(function (a) {
      draw(a[0].documents || [], a[1]);
      var t = new Date();
      $("#when").textContent = "읽은 때 " +
        String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
    })
    .catch(function (e) {
      $("#out").innerHTML = '<div class="msg">읽지 못했습니다. 인터넷을 확인해 주세요.<br>' +
        esc(e.message) + "</div>";
    })
    .then(function () { $("#again").disabled = false; });
}

$("#again").onclick = load;
load();
</script>
</body>
</html>
