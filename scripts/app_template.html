<title>산안법 조문 찾기</title>
__HEAD_EXTRA__
<style>
:root{
  --ground:#f7f8f6; --surface:#ffffff; --surface-2:#eef1ee; --sunk:#e9ede9;
  --ink:#12171a; --ink-2:#4a554e; --ink-3:#78837c;
  --line:#dde3de; --line-2:#c9d2cb;
  --accent:#0e6b45; --accent-ink:#ffffff; --accent-soft:#e2efe8;
  --mark:#ffe9a8; --mark-ink:#3d2f00;
  --danger:#b23a2e;
  --t1:#0e6b45; --t2:#2f7f5f; --t3:#4f8f78; --t4:#6f9c8c; --t5:#8a9a92; --t6:#a2aaa6;
  --shadow:0 1px 2px rgba(18,23,26,.06), 0 8px 24px rgba(18,23,26,.06);
  --tap:44px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0f1412; --surface:#161c19; --surface-2:#1d2521; --sunk:#111815;
    --ink:#e7ede9; --ink-2:#a3b0a8; --ink-3:#7e8b84;
    --line:#26302b; --line-2:#33403a;
    --accent:#4fcf97; --accent-ink:#08140e; --accent-soft:#1a2b23;
    --mark:#5a4508; --mark-ink:#ffe6a0;
    --danger:#e9776a;
    --t1:#4fcf97; --t2:#57bd91; --t3:#5faa8a; --t4:#679883; --t5:#6f877d; --t6:#68756f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0f1412; --surface:#161c19; --surface-2:#1d2521; --sunk:#111815;
  --ink:#e7ede9; --ink-2:#a3b0a8; --ink-3:#7e8b84;
  --line:#26302b; --line-2:#33403a;
  --accent:#4fcf97; --accent-ink:#08140e; --accent-soft:#1a2b23;
  --mark:#5a4508; --mark-ink:#ffe6a0;
  --danger:#e9776a;
  --t1:#4fcf97; --t2:#57bd91; --t3:#5faa8a; --t4:#679883; --t5:#6f877d; --t6:#68756f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%; word-break:keep-all; overflow-wrap:anywhere;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top{
  position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;
}
.brand{display:flex;align-items:center;gap:9px;padding-bottom:9px}
.mark{
  width:24px;height:24px;flex:none;border-radius:5px;background:var(--accent);
  display:grid;place-items:center;color:var(--accent-ink);
  font-family:var(--font-serif);font-weight:700;font-size:13px;line-height:1
}
.brand h1{
  margin:0;font-family:var(--font-serif);font-weight:700;
  font-size:16px;letter-spacing:-.01em
}
.brand .stamp{
  margin-left:auto;font-size:11.5px;color:var(--ink-2);letter-spacing:.01em;
  white-space:nowrap;font-variant-numeric:tabular-nums
}
.themebtn{margin-left:8px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.themebtn:hover{background:var(--surface-2);color:var(--ink)}

.searchbar{position:relative;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:11px;
  padding:0 10px;height:var(--tap);box-shadow:var(--shadow)}
.searchbar:focus-within{border-color:var(--accent)}
.searchbar svg{flex:none;color:var(--ink-3)}
#q{flex:1;min-width:0;border:0;background:none;height:100%;outline:0;font-size:16px}
#q::placeholder{color:var(--ink-3)}
.clear{width:28px;height:28px;border-radius:50%;display:none;place-items:center;color:var(--ink-3);background:var(--surface-2)}
.clear.on{display:grid}

.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

main{flex:1;padding:0 14px calc(78px + env(safe-area-inset-bottom))}
.view[hidden]{display:none}

/* ---------- result list ---------- */
.meta{display:flex;align-items:baseline;gap:8px;padding:12px 2px 8px;font-size:12px;color:var(--ink-3)}
.meta b{color:var(--ink-2);font-variant-numeric:tabular-nums}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;display:block;box-shadow:0 1px 1px rgba(18,23,26,.03)}
.card:active{background:var(--surface-2)}
.card .head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.badge{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 6px;border-radius:5px;
  color:var(--accent-ink);background:var(--t1);white-space:nowrap}
.badge.l2{background:var(--t2)}.badge.l3{background:var(--t3)}
.badge.l4{background:var(--t4)}.badge.l5{background:var(--t5)}.badge.l6{background:var(--t6)}
.badge.tbl{background:none;color:var(--ink-2);border:1px solid var(--line-2)}
.card .no{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.card .ttl{font-family:var(--font-serif);font-weight:600;font-size:14.5px;color:var(--ink)}
.card .src{font-size:11px;color:var(--ink-3);margin-left:auto}
.card .snip{font-size:13px;color:var(--ink-2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.more{width:100%;margin-top:10px;padding:11px;border:1px dashed var(--line-2);border-radius:11px;
  color:var(--ink-2);font-size:13px;font-weight:500}
.empty{padding:44px 16px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.8}
.empty b{display:block;color:var(--ink-2);font-family:var(--font-serif);font-size:15px;margin-bottom:6px}

/* ---------- 첫 화면 ---------- */
.sec{margin:18px 0 8px;font-size:11px;letter-spacing:.09em;color:var(--ink-3);font-weight:700}
.verbox{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:2px 13px}
.verline{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.verline:last-child{border-bottom:0}
.verline b{flex:none;width:66px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
.verline span{flex:1;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.55}
.verbtn{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:14px;font-weight:600}
.verbtn:disabled{color:var(--ink-3)}
.verbtn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vernote{margin:9px 2px 0;font-size:12px;line-height:1.65;color:var(--ink-3)}
.savego{width:100%;display:flex;align-items:center;gap:7px;margin:0 0 10px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--accent);font-size:13px;font-weight:600;text-align:left}
.savego span{flex:1;min-width:0}
.savego svg{flex:none}
.sechead{width:100%;display:flex;align-items:center;justify-content:space-between;
  margin:18px 0 8px;padding:0 2px;font-size:11px;letter-spacing:.09em;color:var(--ink-3);font-weight:700}
.sechead .ar{font-size:12px;transition:transform .15s;transform:rotate(-90deg)}
.sechead .ar.open{transform:none}
.chg{margin:0 0 4px;padding:9px 2px;border-bottom:1px solid var(--line)}
.chg:last-child{border-bottom:0}
.chg .d{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.chg ul{margin:4px 0 0;padding:0;list-style:none}
.chg li{position:relative;padding-left:10px;font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.chg li::before{content:"·";position:absolute;left:2px;color:var(--ink-3)}
.by{margin:22px 2px 2px;font-size:12px;line-height:1.65;color:var(--ink-3);text-align:center}
.hint{margin:30px 4px 30px;font-size:13px;line-height:2.1;color:var(--ink-3)}
.hint b{color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;text-align:left;min-width:0;overflow:hidden}
.quick .k{display:block;font-size:11px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.quick .v{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tocline{width:100%;display:flex;align-items:center;gap:8px;margin-top:22px;padding:13px 2px;
  border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;text-align:left}
.tocline .grow{flex:1;font-variant-numeric:tabular-nums}
.tocline em{font-style:normal;color:var(--ink-2);font-weight:500}

/* ---------- index ---------- */
.row{width:100%;display:flex;align-items:center;gap:10px;padding:12px 13px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;text-align:left}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;font-size:14px}
.row .s{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .arw{color:var(--ink-3);flex:none}
.crumb{display:flex;align-items:center;gap:6px;padding:12px 2px 6px;font-size:12.5px;color:var(--ink-3)}
.crumb button{color:var(--accent);font-weight:700}
.chap{margin:16px 0 7px;font-family:var(--font-serif);font-weight:600;font-size:13.5px;color:var(--ink-2);
  border-left:3px solid var(--accent);padding-left:8px}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.artgrid button{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 9px;text-align:left;min-width:0;overflow:hidden}
.artgrid .n{display:block;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.artgrid .m{display:block;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artgrid .del{color:var(--ink-3);text-decoration:line-through}

/* ---------- reader ---------- */
.reader{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;flex-direction:column}
.reader[hidden]{display:none}
.iconbtn[hidden]{display:none}
.rtop{display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--line);background:var(--ground)}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.on{color:var(--accent)}
.rtop .who{flex:1;min-width:0;text-align:center}
.rtop .who .a{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .who .b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch}
.rwrap{max-width:62ch;margin:0 auto}
.rtitle{font-family:var(--font-serif);font-weight:700;font-size:21px;line-height:1.4;margin:0 0 3px;text-wrap:balance}
.rchap{font-size:12px;color:var(--ink-3);margin-bottom:7px}
.rwhen{display:inline-block;margin:0 0 16px;padding:3px 10px;border-radius:20px;
  background:var(--surface-2);color:var(--ink-2);font-size:11.5px;font-weight:600;
  letter-spacing:.01em;font-variant-numeric:tabular-nums}
.art{font-size:16px;line-height:1.8}
.art p{margin:0 0 12px;white-space:pre-line}
.moved{margin:0 0 14px;padding:10px 12px;background:var(--surface-2);border-radius:9px;
  font-size:13.5px;color:var(--ink-2);white-space:normal}
.hang{margin:0 0 14px}
.hang .hn{font-weight:700;color:var(--accent);margin-right:3px}
.ho{margin:7px 0 0 14px;padding-left:2px;color:var(--ink-2);font-size:15px;line-height:1.72;white-space:pre-line}
.del{color:var(--ink-3)}
/* 제12장 벌칙·과태료 — 조문을 읽다 바로 눈에 들되, 본문과 섞이지는 않아야 한다 */
.pen{margin:10px 0 14px;padding:9px 12px;border-radius:9px;background:var(--surface-2);
  font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.pen + .pen{margin-top:-8px}
.pen .tag{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:5px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--accent-ink);background:var(--t3)}
.pen .tag.fine{background:var(--t5)}
.pen .lim{color:var(--ink-3)}
.pen .when{display:block;margin:3px 0 5px;font-size:13px;line-height:1.6;color:var(--ink)}
.pen .cha{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pen .src{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.pen .open{margin-top:5px;font-size:12.5px;font-weight:600;color:var(--accent)}
.pen ul{margin:7px 0 0;padding:0;list-style:none}
.pen li{margin:0 0 7px;padding-left:10px;border-left:2px solid var(--line-2)}
.pen li:last-child{margin-bottom:0}
.pen li .w{display:block;color:var(--ink-2)}
a.ref,button.ref{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;cursor:pointer;white-space:nowrap}
button.ref{display:inline;padding:0;border:0;background:none;font:inherit;text-align:inherit}
.delegation label{display:block;margin:20px 0 7px;font-size:13px;font-weight:700}
.delegation input{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:9px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.delegation .dcount{margin:12px 0 6px;font-size:12px;color:var(--ink-3)}
.delegation .drow{display:block;width:100%;padding:14px 2px;border:0;border-bottom:1px solid var(--line);
  background:none;text-align:left;color:var(--ink);font-size:14px;line-height:1.6}
.delegation .drow small{display:block;color:var(--ink-3);font-size:11.5px}
.tblwrap{overflow-x:auto;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px}
/* 표가 아닌 별표 — 괘선을 걷어냈으므로 본문처럼 접히게 둔다 */
.tbltext{font-size:16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:break-word}
/* 괘선표에서 풀어낸 진짜 표 */
.gridwrap{overflow-x:auto;margin:0 0 14px;-webkit-overflow-scrolling:touch}
.grid{border-collapse:collapse;font-size:13.5px;line-height:1.6;min-width:100%}
.grid th,.grid td{border:1px solid var(--line-2);padding:7px 9px;vertical-align:top;
  text-align:left;white-space:pre-wrap;min-width:5em;overflow-wrap:break-word;word-break:keep-all}
.grid th{background:var(--surface-2);font-weight:700}
pre.tbl{margin:0;font-family:var(--font-mono);font-size:var(--tblsize,12px);
  line-height:1.5;white-space:pre;color:var(--ink)}
.zoom{display:flex;gap:6px;align-items:center;margin:10px 0 6px;font-size:12px;color:var(--ink-3)}
.zoom button{border:1px solid var(--line-2);border-radius:7px;width:30px;height:30px;color:var(--ink-2)}
.rfoot{display:flex;gap:8px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.rfoot button,.rfoot a{flex:1;padding:11px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);
  font-size:13px;font-weight:500;color:var(--ink-2);text-align:center;text-decoration:none}
.rfoot button[disabled]{opacity:.35}
.note{margin-top:14px;font-size:11.5px;color:var(--ink-3);line-height:1.65}

/* ---------- tabs ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(3,1fr);max-width:760px;margin:0 auto}
nav.tabs button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:11px;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
nav.tabs svg{width:20px;height:20px}

/* ---------- 기타 ---------- */
.seg{display:flex;gap:6px;margin:0 0 12px}
.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.advnote{margin:0 2px 12px;font-size:12.5px;line-height:1.7;color:var(--ink-3)}
.advnote b{color:var(--ink-2);font-weight:700}
.basics section{margin:0 0 22px}
.basics h2{margin:0 0 8px;font-size:15px;color:var(--accent)}
.basics dl{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.basics dl>div{padding:13px 0;border-bottom:1px solid var(--line)}
.basics dl>div:last-child{border-bottom:0}
.basics dt{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--ink)}
.basics dd{margin:0;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.basics .note{margin:10px 2px 0;font-size:12.5px;line-height:1.75;color:var(--ink-2)}
.basics .sources{margin:8px 2px 0;font-size:11.5px;line-height:1.8;color:var(--ink-3)}
.basics .sources a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.fold{width:100%;margin:0 0 8px;padding:12px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;text-align:left}
.fold.open{border-color:var(--accent);color:var(--accent)}
/* 규모 눈금 — 하나로 이어진 세로줄에 눈금을 찍는다.
   줄이 끊기지 않아야 "커질수록 얹힌다"가 눈에 들어온다. */
.scale{position:relative;margin:0;padding:2px 0 2px 22px;list-style:none}
.scale::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:2px;
  background:linear-gradient(var(--line-2),var(--accent))}
.scale>li{position:relative;padding:0 0 20px;list-style:none}
.scale>li:last-child{padding-bottom:2px}
.scale>li::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--ground)}
.scale>li.off::before{background:var(--ground);border:2px solid var(--line-2)}
.tick{font-family:var(--font-serif);font-weight:700;font-size:15.5px;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.4}
.off .tick{color:var(--ink-3)}
.mnote{margin-top:1px;font-size:11.5px;color:var(--ink-3)}
.duty{margin:7px 0 0;padding:0;list-style:none}
.duty li{margin:0 0 11px;list-style:none}
.duty li:last-child{margin-bottom:0}
.duty .w{display:block;font-size:14px;font-weight:600;color:var(--ink);line-height:1.5}
.duty .sub{display:block;margin-top:3px;font-size:12px;line-height:1.65;color:var(--ink-3)}

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem("osh:" + k)); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("osh:" + k, JSON.stringify(v)); } catch (e) {} }
};

let DOCS = [], RECS = [], BYKEY = new Map();
let saved = store.get("saved", []), recent = store.get("recent", []);
let filter = "전체", shown = 60, hits = [], tab = "search";
let idxDoc = null, views = [];
let advPage = null;   /* 기타 탭에서 들어와 있는 갈래 (null=첫 화면) */
let savedOpen = store.get("savedOpen", true);   /* 저장한 조문을 펴 두었는지 */
let hlToks = [];   /* 조문 안에 남겨 둘 형광펜 낱말 */
let BASIS = "", NEWEST = "";

/* ---------------- 데이터 펼치기 ---------------- */
async function gunzip(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}

__DATA_LOADER__

async function boot() {
  if (typeof DecompressionStream === "undefined") {
    $("#boot").innerHTML = '<div class="in"><h2>브라우저를 업데이트해 주세요</h2><p>기기 안에서 법령 원문을 펼치려면 최신 브라우저가 필요합니다. 사파리 또는 크롬을 업데이트한 뒤 다시 열어 주세요.</p></div>';
    return;
  }
  DOCS = JSON.parse(await loadLawText());
  buildIndex();
  start();
}

function buildIndex() {
  DOCS.forEach((d, di) => {
    (d.조문 || []).forEach((a, ai) => {
      let t = a.본문 || "";
      (a.항 || []).forEach(h => {
        t += "\n" + (h.내용 || "");
        (h.호 || []).forEach(x => { t += "\n" + x; });
      });
      if (a.참고) t += "\n" + a.참고;
      const chap = (a.장 || "") + (a.절 ? " · " + a.절 : "");
      const r = { d: di, i: ai, kind: 0, no: a.조번호 || "", title: a.제목 || "", chap: chap, del: !!a.삭제, body: t };
      r.hay = (r.no + " " + r.title + " " + t).toLowerCase();
      r.key = di + ":j:" + ai;
      RECS.push(r); BYKEY.set(r.key, r);
    });
    (d.별표 || []).forEach((b, bi) => {
      const ps = b.조각 || null;
      const r = { d: di, i: bi, kind: 1, no: b.번호 || "", title: b.제목 || "", chap: "",
                  body: ps ? piecesText(ps) : (b.내용 || ""), flow: !!b.글, ps: ps };
      r.hay = (r.no + " " + r.title).toLowerCase();
      r.key = di + ":b:" + bi;
      RECS.push(r); BYKEY.set(r.key, r);
    });
  });
}

/* 괘선표에서 풀어낸 별표 — 검색은 글자만 이어 붙여서 하고, 화면은 표로 그린다 */
function piecesText(ps) {
  return ps.map(p => p[0] === "t" ? p[1]
    : p[1].map(row => row.map(c => typeof c === "string" ? c : c[0]).join(" ")).join("\n")
  ).join("\n");
}

function piecesHTML(ps) {
  return ps.map(p => {
    if (p[0] === "t") return '<div class="tbltext">' + esc(p[1]) + "</div>";
    const rows = p[1];
    let out = '<div class="gridwrap"><table class="grid">';
    rows.forEach((row, i) => {
      const tag = (i === 0 && rows.length > 1) ? "th" : "td";
      out += "<tr>" + row.map(c => {
        const t = typeof c === "string" ? c : c[0];
        const n = typeof c === "string" ? 1 : c[1];
        return "<" + tag + (n > 1 ? ' colspan="' + n + '"' : "") + ">" + esc(t) + "</" + tag + ">";
      }).join("") + "</tr>";
    });
    return out + "</table></div>";
  }).join("");
}

/* 별표 본문은 용량이 커서, 필요해질 때 한 번만 소문자 사본을 만든다 */
let deepReady = false;
function prepDeep() {
  if (deepReady) return;
  for (const r of RECS) if (r.kind === 1) r.deep = r.body.toLowerCase();
  deepReady = true;
}

/* ---------------- 검색 ---------------- */
/* 긴 이름을 먼저 둔다 — "중대재해 시행령 4" 가 "중대재해" 에서 잘리면 뒤가 안 읽힌다 */
const ALIAS = [
  [/^(중대재해처벌법\s*시행령|중대재해\s*시행령|중대재해령|중처령)\s*/, "중대재해 처벌 등에 관한 법률 시행령"],
  [/^(중대재해처벌법|중대재해법|중처법|중대재해)\s*/, "중대재해 처벌 등에 관한 법률"],
  [/^(근로감독관\s*집무규정|감독관\s*집무규정|집무규정|감독규정)\s*/, "근로감독관 집무규정(산업안전보건)"],
  [/^(산안법|법률|법)\s*/, "산업안전보건법"],
  [/^(시행령|령|영)\s*/, "산업안전보건법 시행령"],
  [/^(시행규칙|시규)\s*/, "산업안전보건법 시행규칙"],
  [/^(안전보건규칙|기준규칙|기준|안보규칙|규칙)\s*/, "산업안전보건기준에 관한 규칙"]
];

function search(qRaw) {
  const q = qRaw.trim();
  if (!q) return [];
  let pool = RECS.filter(r => filter === "전체" || DOCS[r.d].군 === filter);

  /* "법 38", "규칙 제32조의2", "별표 3" 처럼 번호로 바로 찾기 */
  let jump = [];
  let rest = q, docName = null, called = "";
  for (const [re, name] of ALIAS) {
    const m = re.exec(rest);
    if (m) { docName = name; called = m[1]; rest = rest.replace(re, ""); break; }
  }

  /* 법령 이름만 친 경우 — 그 법령을 통째로 펼친다. "중대재해처벌법" 은 조문 어디에도
     안 나오는 말이라 낱말로 찾으면 한 건도 안 나온다. "법" "기준" 처럼 한두 글자로
     줄여 부른 것은 낱말 검색일 수도 있어 건드리지 않는다. */
  if (docName && !rest && called.replace(/\s/g, "").length >= 3)
    return pool.filter(r => DOCS[r.d].법령명 === docName);

  const mArt = /^제?\s*(\d+)\s*조?(?:\s*의\s*(\d+))?$/.exec(rest);
  const mTbl = /^별표\s*(\d+)(?:\s*의\s*(\d+))?$/.exec(rest);
  if (mArt || mTbl) {
    const want = mArt ? "제" + mArt[1] + "조" + (mArt[2] ? "의" + mArt[2] : "")
                      : "별표 " + mTbl[1] + (mTbl[2] ? "의" + mTbl[2] : "");
    jump = pool.filter(r => r.no === want && (!docName || DOCS[r.d].법령명 === docName));
    jump.sort((a, b) => DOCS[a.d].단계 - DOCS[b.d].단계);
  }

  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  /* 번호로 바로 찾아간 때는 조문을 눈으로 좇을 일이 없어 형광펜이 방해만 된다 */
  hlToks = (mArt || mTbl) ? [] : toks;
  if (/[a-z]/.test(q.toLowerCase())) prepDeep();

  const out = [];
  for (const r of pool) {
    let ok = true, inTitle = 0;
    for (const t of toks) {
      if (r.hay.indexOf(t) < 0 && !(r.kind === 1 && (r.deep || r.body).indexOf(t) >= 0)) { ok = false; break; }
      if (r.title.toLowerCase().indexOf(t) >= 0) inTitle++;
    }
    if (!ok) continue;
    r._score = inTitle * 40 + (r.kind === 0 ? 20 : 0) - DOCS[r.d].단계 * 2 - (r.del ? 30 : 0);
    out.push(r);
  }
  out.sort((a, b) => b._score - a._score || a.d - b.d || a.i - b.i);
  const seen = new Set(jump.map(r => r.key));
  return jump.concat(out.filter(r => !seen.has(r.key)));
}

function snippet(r, toks) {
  const src = r.kind === 1 ? r.body : (r.body || r.title);
  const low = src.toLowerCase();
  let at = -1;
  for (const t of toks) { const p = low.indexOf(t); if (p >= 0 && (at < 0 || p < at)) at = p; }
  let from = Math.max(0, at < 0 ? 0 : at - 40);
  let text = src.slice(from, from + 190).replace(/\s+/g, " ").trim();
  if (from > 0) text = "… " + text;
  return hl(text, toks);
}
function hl(text, toks) {
  let h = esc(text);
  for (const t of toks) {
    if (!t) continue;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    h = h.replace(re, m => "" + m + "");
  }
  return h.replace(//g, "<mark>").replace(//g, "</mark>");
}

/* ---------------- 조문 속 형광펜 ----------------
   찾던 낱말은 조문을 열어도 그대로 남아 있어야 한다. 다시 눈으로 훑을 일이 없어진다.
   본문 글을 다시 만들지 않고 텍스트 마디만 <mark> 로 감싼다 — 그래야 linkify 가
   심어 둔 인용 링크가 상하지 않는다. 머리의 형광펜 단추를 누르면 걷어내고,
   걷어낼 것이 없으면 단추도 내보이지 않는다. */
const HLSKIP = "mark, .rfoot, .note, .rtitle, .rchap, .rwhen, .zoom";

function paintHL() {
  const box = $("#rbody"), btn = $("#rhl");
  if (btn) btn.hidden = true;
  if (!box || !hlToks.length) return;
  const pat = hlToks.filter(Boolean)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  if (!pat) return;
  const re = new RegExp(pat, "gi");

  const walk = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.nodeValue.trim() && !n.parentNode.closest(HLSKIP)
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const targets = [];
  for (let n = walk.nextNode(); n; n = walk.nextNode()) {
    re.lastIndex = 0;
    if (re.test(n.nodeValue)) targets.push(n);
  }

  let hit = 0;
  for (const n of targets) {
    const src = n.nodeValue, frag = document.createDocumentFragment();
    let last = 0;
    re.lastIndex = 0;
    for (let m; (m = re.exec(src)); ) {
      if (!m[0]) { re.lastIndex++; continue; }
      if (m.index > last) frag.appendChild(document.createTextNode(src.slice(last, m.index)));
      const el = document.createElement("mark");
      el.textContent = m[0];
      frag.appendChild(el);
      last = m.index + m[0].length;
      hit++;
    }
    if (last < src.length) frag.appendChild(document.createTextNode(src.slice(last)));
    n.parentNode.replaceChild(frag, n);
  }
  if (btn) btn.hidden = !hit;
}

/* 형광펜을 걷어낸다. 조문을 옮겨 다녀도 다시 칠해지지 않도록 낱말까지 버린다. */
function clearHL() {
  hlToks = [];
  const box = $("#rbody");
  if (box) box.querySelectorAll("mark").forEach(m => {
    const p = m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent), m);
    p.normalize();
  });
  if ($("#rhl")) $("#rhl").hidden = true;
}

function renderSearch() {
  const v = $("#v-search"), q = $("#q").value.trim();
  if (!q) {
    hlToks = [];   /* 검색을 비웠으면 형광펜도 없다 */
    /* 첫 화면은 내가 모아 둔 것으로 연다. 저장이 쌓이면 길어지므로 접을 수 있게 하고,
       접었는지는 기억해 둔다 — 매번 다시 접는 수고를 시키지 않는다. */
    const sv = saved.map(k => BYKEY.get(k)).filter(Boolean);
    let h = "";
    if (sv.length) {
      h += '<button class="sechead" id="savefold"><span>저장한 조문 ' + sv.length + "</span>" +
        '<span class="ar' + (savedOpen ? " open" : "") + '">▾</span></button>';
      if (savedOpen) h += '<ul class="list">' + sv.map(r => cardHTML(r)).join("") + "</ul>";
    } else {
      h += '<div class="sec">저장한 조문</div>' +
        '<div class="empty"><b>아직 없습니다</b>조문을 열고 오른쪽 위 책갈피를 누르면<br>' +
        "현장에서 자주 보는 조문을 여기에 모아 둘 수 있습니다.</div>";
    }
    const rec = recent.map(k => BYKEY.get(k)).filter(Boolean);
    if (rec.length) {
      h += '<div class="sec">최근 본 조문</div><ul class="list">' +
        rec.slice(0, 5).map(r => cardHTML(r)).join("") + "</ul>";
    }
    h += '<button class="tocline" data-tab-go="index"><span class="grow"><em>' + DOCS.length +
      "개 법령</em> · 조문 " + RECS.filter(r => r.kind === 0).length.toLocaleString() +
      " · 별표 " + RECS.filter(r => r.kind === 1).length.toLocaleString() +
      "</span><span>목차</span>" + ARW + "</button>";
    v.innerHTML = h;
    return;
  }
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!hits.length) {
    v.innerHTML = '<div class="empty"><b>결과가 없습니다</b>낱말을 줄이거나 “제38조”처럼 조문 번호로,<br>또는 “령 16”처럼 법령을 앞에 붙여 찾아보세요.</div>';
    return;
  }
  const list = hits.slice(0, shown).map(r => cardHTML(r, toks)).join("");
  /* 저장한 조문은 검색을 비워야 보인다. 찾는 중에도 갈 길이 있어야, 책갈피해 둔 것이
     어디로 갔는지 헤매지 않는다. */
  const nsaved = saved.filter(k => BYKEY.has(k)).length;
  v.innerHTML = (nsaved ? '<button class="savego" id="savego">' + STAR +
      "<span>저장한 조문 " + nsaved + "</span>" + ARW + "</button>" : "") +
    '<div class="meta">조문·별표 <b>' + hits.length.toLocaleString() + "</b>건" +
    (filter !== "전체" ? " · " + esc(filter) : "") + "</div><ul class=\"list\">" + list + "</ul>" +
    (hits.length > shown ? '<button class="more" id="more">' + (hits.length - shown).toLocaleString() + "건 더 보기</button>" : "");
}

const ARW = '<svg class="arw" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

/* 제목 앞에는 원문의 종류를 표시한다. 약호·검색 묶음·우선순위는 따로 유지한다. */
function badgeLabel(d) {
  if (["고시", "훈령", "예규"].includes(d.법령구분)) return d.법령구분;
  return d.약호 === "취업제한" ? "부령" : d.약호;
}

function cardHTML(r, toks) {
  const d = DOCS[r.d];
  const tk = toks || [];
  return '<li><button class="card" data-key="' + r.key + '">' +
    '<span class="head"><span class="badge l' + d.단계 + '">' + esc(badgeLabel(d)) + "</span>" +
    '<span class="no' + (r.del ? " del" : "") + '">' + esc(r.no) + "</span>" +
    (r.title ? '<span class="ttl">' + hl(r.title, tk) + "</span>" : "") +
    (r.kind === 1 ? '<span class="src">별표</span>' : "") + "</span>" +
    '<span class="snip">' + snippet(r, tk) + "</span></button></li>";
}

function renderIndex() {
  const v = $("#v-index");
  if (idxDoc === null) {
    v.innerHTML = '<div class="sec">법령을 고르세요</div><ul class="list">' + DOCS.map((d, i) =>
      '<button class="row" data-doc="' + i + '"><span class="badge l' + d.단계 + '">' + esc(badgeLabel(d)) + '</span>' +
      '<span class="grow"><span class="t">' + esc(d.법령명) + '</span><br><span class="s">' +
      (d.조문 || []).length + "개 조문" + ((d.별표 || []).length ? " · 별표 " + d.별표.length : "") +
      " · 시행 " + esc(d.시행일) + (d.공포일 ? " · 공포 " + esc(d.공포일) : "") +
      "</span></span>" + ARW + "</button>").join("") + "</ul>";
    return;
  }
  const d = DOCS[idxDoc];
  let h = '<div class="crumb"><button id="idxback">법령 목록</button><span>›</span><span>' + esc(d.법령명) + "</span></div>";
  let chap = null;
  h += '<div class="artgrid">';
  (d.조문 || []).forEach((a, ai) => {
    const c = (a.장 || "") + (a.절 ? " " + a.절 : "");
    if (c !== chap) { chap = c; h += "</div>" + (c ? '<div class="chap">' + esc(c) + "</div>" : "") + '<div class="artgrid">'; }
    h += '<button data-key="' + idxDoc + ":j:" + ai + '"><span class="n' + (a.삭제 ? " del" : "") + '">' +
      esc(a.조번호) + '</span><br><span class="m">' + esc(a.제목 || (a.삭제 ? "삭제" : (a.참고 ? "이동" : ""))) + "</span></button>";
  });
  h += "</div>";
  if ((d.별표 || []).length) {
    h += '<div class="chap">별표 · 서식</div><ul class="list">' + d.별표.map((b, bi) =>
      '<button class="row" data-key="' + idxDoc + ":b:" + bi + '"><span class="badge tbl">' + esc(b.번호) + "</span>" +
      '<span class="grow"><span class="t">' + esc(b.제목 || "-") + "</span></span>" + ARW + "</button>").join("") + "</ul>";
  }
  v.innerHTML = h;
}

      '국가법령정보센터 원문 그대로이며, <b>법적 효력은 원문에 있습니다.</b></p>' +
      '<ul class="list">' +
      advMenu("basics", "기초 법지식", "법령·행정규칙의 종류 · 과태료와 사법조치") +
      advMenu("pen", "벌칙 모아보기",

      "</ul>" +
      '<p class="by">제작: 김익중(kij@kosha.or.kr)</p>';
    return;
  }
  let h = '<div class="crumb"><button id="advback">기타</button><span>›</span><span>' +
    esc(ADV_NAME[advPage] || "") + "</span></div>";
  h += advPage === "basics" ? basicsPage()
     : advPage === "pen" ? penPage()
     : advPage === "scale" ? scaleHTML()
     : verPage();
  v.innerHTML = h;
  if (advPage === "ver") mountVersion();
  v.querySelectorAll("[data-adv]").forEach(b => b.onclick = () => { advWhat = b.dataset.adv; renderAdv(); });
  v.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => {
    const box = $("#" + b.dataset.sc);
    box.hidden = !box.hidden;
    b.classList.toggle("open", !box.hidden);
  });
}

function basicsPage() {

      ["법(법률)", "국회가 의결해 만드는 규범입니다. 국민의 권리·의무와 국가 운영의 기본 사항을 정합니다. 산업안전보건법이 여기에 해당합니다."],

      ["시행규칙(부령)", "법률·시행령의 위임사항이나 집행에 필요한 세부 절차·서식 등을 부처 장관이 정합니다. 총리령으로 정하는 시행규칙도 있으며, 산안법 시행규칙은 고용노동부령입니다."]
    ]) + '<p class="note">이 앱의 「기준규칙」과 「취업제한규칙」도 고용노동부령입니다.</p>' +
    '<p class="sources">근거: ' + source("https://www.law.go.kr/법령/대한민국헌법", "헌법 제40조·제75조·제95조") + '</p></section>' +

      ["훈령", "상급기관이 하급기관의 업무 처리와 권한 행사에 관해 내리는 일반적인 지시입니다. 근로감독관 집무규정이 그 예입니다."],

function penPage() {

/* 그 벌 종류가 걸린 산안법 조문을 조 번호 차례로 모은다 */
function penList(kind) {
  const di = DOCS.findIndex(d => d.법령명 === "산업안전보건법");
  if (di < 0) return [];
  return (DOCS[di].조문 || []).map((a, ai) => ({ a, ai, di }))
    .filter(({ a }) => {
      const p = a.벌;
      if (!p) return false;
      return [].concat(...Object.values(p.항 || {}), p.끝 || []).some(it => it.t === kind);
    });
}

function advGrid() {
  const list = penList(advWhat === "fine" ? "과" : "벌");
  /* 둘 다 제12장 '벌칙' 이지만 성격이 다르다 — 형벌은 전과가 남고, 과태료는 남지 않는다 */
  const what = advWhat === "fine"
    ? "과태료(제175조)가 따르는"
    : "형벌(징역·벌금, 제167조~제172조)이 따르는";
  if (!list.length) return '<div class="empty"><b>없습니다</b></div>';
  /* 장별로 묶어 둔다. 조문 차례가 곧 장 차례라 훑기만 해도 갈린다. 걸리는 조문이
     하나도 없는 장은 아예 나오지 않으니, 어느 장에 몰려 있는지가 그대로 보인다. */
  let out = "", chap = null, bag = [];
  const flush = () => {
    if (!bag.length) return;
    out += '<div class="chap">' + esc(chap) + ' <span class="cn">' + bag.length + "</span></div>" +
      '<div class="artgrid">' + bag.join("") + "</div>";
    bag = [];
  };
  list.forEach(({ a, ai, di }) => {
    const c = a.장 || "";
    if (c !== chap) { flush(); chap = c; }
    bag.push('<button data-key="' + di + ":j:" + ai + '"><span class="n">' + esc(a.조번호) +
      '</span><br><span class="m">' + esc(a.제목 || "") + "</span></button>");
  });
  flush();
  return '<p class="advnote">' + what + " 산업안전보건법 조문 " + list.length +
    "개입니다. 눌러서 조문과 내용을 봅니다.</p>" + out;
}

/* 근거를 실제 조문·별표에 잇는다. 못 이으면 글자만 남긴다 (법이 개정된 경우) */
function refBtn(name, no) {
  const r = RECS.find(x => DOCS[x.d].법령명 === name && x.no === no);
  const d = DOCS.findIndex(x => x.법령명 === name);
  const 약호 = d >= 0 ? DOCS[d].약호 : "";
  const label = esc((약호 ? 약호 + " " : "") + no);
  return r ? '<button class="reflink" data-key="' + r.key + '">' + label + "</button>"
           : '<span class="reflink off">' + label + "</span>";
}

let scSeq = 0;

   위에서 아래로 내려갈수록 앞의 의무가 그대로 얹힌다 — 눈금을 따라가면 그것이 보인다. */
function scaleHTML() {
  const stop = b => {
    const more = b.items.filter(it => it.빠짐);

    return '<li class="stop' + (b.tone === "off" ? " off" : "") + '">' +
      '<div class="tick">' + esc(b.n) + "</div>" +
      (b.note ? '<div class="mnote">' + esc(b.note) + "</div>" : "") +
      '<ul class="duty">' + b.items.map(it =>
        '<li><span class="w">' + esc(it.일) + "</span>" +
        (it.주 ? '<span class="sub">' + esc(it.주) + "</span>" : "") +

        (it.빠짐 ? '<button class="open" data-sc="' + id + '">무엇이 빠지는지 ▸</button>' +
          '<ul id="' + id + '" class="gone" hidden>' + it.빠짐.map(x =>

          "</ul>" : "") +

      "</ul></li>";
  };
  const box = "scbox" + (scSeq++);
  return '<p class="advnote">규모가 커질수록 <b>앞의 의무가 그대로 얹힙니다.</b> 업종에 따라 ' +
    '기준이 갈리는 것은 <b>가장 낮은 기준</b> 눈금에 두고 그 사정을 함께 적었습니다. ' +
    '정리한 표이니 반드시 옆의 근거 조문으로 확인하세요.</p>' +
    '<ol class="scale">' + SCALE.map(stop).join("") + "</ol>" +
    '<button class="fold" data-sc="' + box + '">건설공사는 공사금액이 기준입니다 ▸</button>' +
    '<div id="' + box + '" hidden><ol class="scale">' + SCALE_C.map(stop).join("") + "</ol></div>";
}

/* 버튼을 먼저 단다. 캐시·등록 조회는 환경에 따라 오래 걸리거나 영영 안 끝나기도 해서,
   그걸 기다리다 버튼을 못 다는 일이 없도록 순서를 갈라 두었다. */
function mountVersion() {
  const mount = $("#vermount");
  /* 단일 HTML 로 연 경우엔 받아올 새 판이 없으니 버튼도 만들지 않는다 */
  if (mount && "serviceWorker" in navigator && location.protocol !== "file:") {
    const btn = document.createElement("button");
    btn.className = "verbtn";
    btn.textContent = "앱 업데이트 확인";
    btn.onclick = () => checkUpdate(btn);
    mount.appendChild(btn);
  }
  fillVersionHash();
}

async function fillVersionHash() {
  const hash = $("#verhash");
  if (!hash || !window.caches) return;
  try {
    const keys = await Promise.race([
      caches.keys(),
      new Promise(r => setTimeout(() => r(null), 3000))
    ]);
    const k = keys && keys.find(x => x.indexOf("osh-") === 0);
    if (k) hash.textContent = k.slice(4);
  } catch (e) {}
}

/* 새 서비스워커가 설치를 끝낼 때까지 기다린다 (오래 걸리면 그냥 넘어간다) */
function swSettled(sw, ms) {
  return new Promise(res => {
    if (!sw) return res(null);
    if (sw.state !== "installing") return res(sw.state);
    const t = setTimeout(() => res(sw.state), ms);
    sw.addEventListener("statechange", () => {
      if (sw.state !== "installing") { clearTimeout(t); res(sw.state); }
    });
  });
}

async function checkUpdate(btn) {
  if (!navigator.onLine) { toast("인터넷에 연결되어 있지 않습니다. 연결한 뒤 다시 눌러 주세요."); return; }
  btn.disabled = true;
  btn.textContent = "확인하는 중…";
  /* 등록이 없거나 조회가 늦으면 여기서 멈추지 않고 안내만 한다 */
  const reg = await Promise.race([
    navigator.serviceWorker.getRegistration().catch(() => null),
    new Promise(r => setTimeout(() => r(null), 10000))
  ]);
  if (!reg) {
    btn.disabled = false; btn.textContent = "앱 업데이트 확인";
    toast("아직 설치가 끝나지 않았습니다. 앱을 닫았다 연 뒤에 다시 눌러 주세요.", 6000); return;
  }
  try {
    await reg.update();
  } catch (e) {
    btn.disabled = false; btn.textContent = "앱 업데이트 확인";
    toast("확인하지 못했습니다. 잠시 뒤 다시 눌러 주세요."); return;
  }
  await swSettled(reg.installing || reg.waiting, 20000);
  btn.disabled = false;
  if (reg.waiting) {
    btn.textContent = "새 판으로 바꾸기";
    btn.classList.add("go");
    btn.onclick = () => {
      btn.disabled = true;
      btn.textContent = "바꾸는 중…";
      navigator.serviceWorker.addEventListener("controllerchange", () => location.reload(), { once: true });
      reg.waiting.postMessage({ type: "skipWaiting" });
    };
    toast("새 법령 판을 받았습니다. 버튼을 한 번 더 누르면 바로 바뀝니다.", 7000);
  } else {
    btn.textContent = "앱 업데이트 확인";
    toast("최신입니다. 새로 올라온 판이 없습니다.");
  }
}

/* ---------------- 리더 ---------------- */
let cur = null, delegation = null;

/* 앞에 붙은 법령 이름을 통째로 잡는다. 「」로 감싼 이름, "산안법" 처럼 줄인 이름,
   "법" "영" 처럼 한 글자로 부른 이름, "이 규칙" "같은 법" 처럼 가리키는 말이 모두 들어온다.
   조문과 별표를 한 번에 훑는다 — "같은 법" 이 무엇을 가리키는지는 앞의 인용이 정하기 때문이다.
   "이" 는 앞에 띄어쓰기가 있어야 관형사다. "…라 한다)이 법 제64조" 의 "이" 는 주격조사다. */
const REF_RE = /(?:「([^」]{2,30})」\s*)?(?:(?:^|[^가-힣])(같은\s*(?:법\s*)?)|(?:^|\s)(이\s*(?:법\s*)?))?([가-힣]{0,11}(?:법률|법|령|영|규칙|규정|지침|고시))?\s*(?:제(\d+)조(?:의(\d+))?|별표\s*(\d+)(?:의(\d+))?)/g;

/* 이름을 그대로 부른 것 — 어느 법령을 읽는 중이든 가리키는 곳이 같다 */
const NAMED_DOC = {
  "산업안전보건법": "산업안전보건법", "산안법": "산업안전보건법",
  "중대재해처벌법": "중대재해 처벌 등에 관한 법률", "중처법": "중대재해 처벌 등에 관한 법률",
  "안전보건규칙": "산업안전보건기준에 관한 규칙", "기준규칙": "산업안전보건기준에 관한 규칙"
};

/* "법" "영" 처럼 짧게 부른 것 — 읽고 있는 법령의 계열 안에서 푼다.
   중대재해처벌법 시행령의 "법 제4조" 는 산안법이 아니라 중대재해처벌법이다. */
const FAMILY_DOC = {
  "산안": {
    "법": "산업안전보건법",
    "영": "산업안전보건법 시행령", "령": "산업안전보건법 시행령", "시행령": "산업안전보건법 시행령",
    "규칙": "산업안전보건법 시행규칙", "시행규칙": "산업안전보건법 시행규칙"
  },
  "중대재해": {
    "법": "중대재해 처벌 등에 관한 법률",
    "영": "중대재해 처벌 등에 관한 법률 시행령", "령": "중대재해 처벌 등에 관한 법률 시행령",
    "시행령": "중대재해 처벌 등에 관한 법률 시행령"
  }
};

/* "같은 법" 이 가리키는 것 — 그 앞에서 마지막으로 「」 안에 부른 법령 이름 */
function priorName(text, at) {
  const i = text.lastIndexOf("「", at);
  if (i < 0) return null;
  const j = text.indexOf("」", i);
  return j > i && j < at ? text.slice(i + 1, j) : null;
}

/* "같은 법 시행령" 은 방금 부른 그 법의 시행령이다 (산안법의 시행령이 아니라).
   "같은 규칙" 처럼 이미 그 갈래를 부르고 있으면 덧붙이지 않는다. */
const SAME_KIND = { "영": "시행령", "령": "시행령", "시행령": "시행령",
                    "규칙": "시행규칙", "시행규칙": "시행규칙" };

function linkify(html, docIdx) {
  if (html.length > 24000) return html;
  let said = null;   /* 이 조각에서 마지막으로 부른 법령 이름 */
  return html.replace(REF_RE, (m, quoted, same, self, marker, art, artSub, tbl, tblSub, offset) => {
    let target = docIdx;
    const name = quoted || null;
    if (name) {
      said = name;
      const f = DOCS.findIndex(d => d.법령명 === name || d.약칭 === name);
      if (f < 0) return m;
      target = f;
    } else if (self) {
      /* "이 규칙 별표 5" — 읽고 있는 바로 그 법령이다 */
    } else if (same) {
      /* 「화학물질관리법」… 같은 법 제3조 — 앞서 부른 그 법이지 산안법이 아니다.
         앞에 부른 이름이 없거나 담지 않은 법이면 링크하지 않는다. */
      const base = priorName(html, offset) || said;
      if (!base) return m;
      const kind = SAME_KIND[marker];
      const want = !kind || base.endsWith(kind.slice(2)) ? base : base + " " + kind;
      const f = DOCS.findIndex(d => d.법령명 === want || d.약칭 === want);
      if (f < 0) return m;
      target = f;
    } else if (marker) {
      /* 담지 않은 법을 부른 인용("진폐법 제5조", "집무규정 제10조")은 링크하지 않는다.
         읽고 있는 조문 안의 제5조로 잘못 보내는 것보다 그냥 두는 편이 낫다. */
      const fam = FAMILY_DOC[(DOCS[docIdx] || {}).계] || FAMILY_DOC["산안"];
      const want = NAMED_DOC[marker] || fam[marker];
      said = want || marker;
      if (!want) return m;
      const f = DOCS.findIndex(d => d.법령명 === want);
      if (f < 0) return m;
      target = f;
    }
    const no = art ? "제" + art + "조" + (artSub ? "의" + artSub : "")
                   : "별표 " + tbl + (tblSub ? "의" + tblSub : "");
    const rec = RECS.find(r => r.d === target && r.kind === (art ? 0 : 1) && r.no === no);
    if (!rec) return m;
    return m.replace(art ? /제\d+조(의\d+)?/ : /별표\s*\d+(의\d+)?/,
                     s => '<a class="ref" data-key="' + rec.key + '">' + s + "</a>");
  });
}

/* 위임 자료는 원문 조각의 문자 위치를 지정한다. 번호 인용을 먼저 처리한 뒤
   텍스트 노드만 감싸서 기존 링크·원문·HTML 이스케이프를 그대로 보존한다. */
function articleText(text, r, part) {
  const html = linkify(esc(text), r.d);
  const links = (DOCS[r.d].조문[r.i].위임 || []).map((x, i) => ({ ...x, id: i }))
    .filter(x => x.부분 === part);
  if (!links.length) return html;
  const box = document.createElement("template"); box.innerHTML = html;
  const walker = document.createTreeWalker(box.content, NodeFilter.SHOW_TEXT);
  const nodes = []; let node, offset = 0;
  while ((node = walker.nextNode())) {
    nodes.push({ node, offset }); offset += node.textContent.length;
  }
  for (const { node, offset } of nodes) {
    const raw = node.textContent;
    const here = links.filter(x => x.시작 >= offset && x.끝 <= offset + raw.length)
      .sort((a, b) => a.시작 - b.시작);
    if (!here.length || node.parentElement?.closest("a,button")) continue;
    const frag = document.createDocumentFragment(); let at = 0;
    for (const x of here) {
      const begin = x.시작 - offset, end = x.끝 - offset;
      if (begin < at) continue;
      const targets = x.대상.map(k => BYKEY.get(k)).filter(Boolean);
      if (!targets.length) continue;
      frag.append(document.createTextNode(raw.slice(at, begin)));
      const b = document.createElement("button"); b.className = "ref delegated";
      b.textContent = raw.slice(begin, end);
      if (targets.length === 1) {
        b.dataset.key = targets[0].key;
        b.title = DOCS[targets[0].d].법령명 + " " + targets[0].no + " " + targets[0].title;
      } else {
        b.dataset.delegate = x.id;
        b.title = "위임받은 조문 " + targets.length + "개 보기";
      }
      b.setAttribute("aria-label", b.textContent + ": " + b.title);
      frag.append(b); at = end;
    }
    frag.append(document.createTextNode(raw.slice(at))); node.replaceWith(frag);
  }
  return box.innerHTML;
}

function showDelegation(id, query = "") {
  const link = cur && (DOCS[cur.d].조문[cur.i].위임 || [])[id];
  if (!link) return;
  delegation = id;
  const targets = link.대상.map(k => BYKEY.get(k)).filter(Boolean);
  $("#rno").textContent = cur.no + " · 위임받은 조문";
  $("#rstar").hidden = true; $("#rhl").hidden = true;
  $("#rbody").innerHTML = '<div class="rwrap delegation"><div class="rtitle">위임받은 조문</div>' +
    '<p class="rchap">' + esc(DOCS[cur.d].법령명 + " " + cur.no) +
    '의 내용을 구체적으로 정한 조문입니다. 읽을 조문을 선택하세요.</p>' +
    '<label for="delegateq">이 목록에서 찾기</label><input id="delegateq" type="search" placeholder="조문 번호나 낱말" autocomplete="off">' +
    '<div class="dcount" id="delegatecount" role="status"></div><div id="delegatelist"></div>' +
    '<p class="note">국가법령정보센터의 위임 연결 자료를 기준으로 앱에 담긴 조문을 보여 줍니다.</p></div>';
  const input = $("#delegateq"); input.value = query;
  const render = () => {
    const terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const found = targets.filter(r => terms.every(t => r.hay.includes(t)));
    $("#delegatecount").textContent = found.length + "개 / 전체 " + targets.length + "개";
    $("#delegatelist").innerHTML = found.map(r => '<button class="drow" data-key="' + r.key + '"><small>' +
      esc(DOCS[r.d].법령명 + (r.chap ? " · " + r.chap : "")) + "</small>" +
      esc(r.no + " " + r.title) + "</button>").join("") || '<p class="note">찾는 조문이 없습니다.</p>';
    const st = history.state;
    if (st && views[st.i]) views[st.i].dq = input.value;
  };
  input.oninput = render; render(); $("#rbody").scrollTop = 0;
}

/* 조문 화면을 그리기만 한다. 히스토리는 go() 가 맡는다. */
function showRec(key) {
  const r = BYKEY.get(key);
  if (!r) return;
  cur = r;
  delegation = null;
  $("#rstar").hidden = false;
  const d = DOCS[r.d];
  $("#rwho").textContent = d.법령명;
  $("#rno").textContent = r.no + (r.title ? "  " + r.title : "");
  $("#rstar").classList.toggle("on", saved.includes(key));
  $("#rstar").querySelector("svg").setAttribute("fill", saved.includes(key) ? "currentColor" : "none");

  let h = '<div class="rwrap">';
  h += '<div class="rtitle">' + esc(r.no) + (r.title ? " <span style=\"font-weight:600\">" + esc(r.title) + "</span>" : "") + "</div>";
  h += '<div class="rchap">' + esc(d.법령명) + (r.chap ? " · " + esc(r.chap) : "") + "</div>";
  /* 시행일은 조문을 읽기 전에 보여야 한다. 조문마다 따로 시행일이 붙은 경우
     (유예된 조문) 는 법령 전체의 시행일과 달라서 그렇게 밝혀 준다. */
  let when = d.시행일, whenLabel = "시행 ";
  if (r.kind !== 1) {
    const a0 = d.조문[r.i];
    if (a0 && a0.조문시행일) {
      when = a0.조문시행일;
      if (a0.조문시행일 !== d.시행일) whenLabel = "이 조문 시행 ";
    }
  }
  if (when) h += '<div class="rwhen">' + whenLabel + esc(when) + "</div>";

  if (r.kind === 1 && r.ps) {
    h += piecesHTML(r.ps);
  } else if (r.kind === 1 && r.flow) {
    /* 칸이 없는 별표는 고정폭으로 붙들어 둘 이유가 없다. 폰 너비에 맞춰 접는다 */
    h += '<div class="tbltext">' + esc(r.body) + "</div>";
  } else if (r.kind === 1) {
    h += '<div class="zoom"><span>표 크기</span><button data-z="-1">−</button><button data-z="1">+</button></div>';
    h += '<div class="tblwrap"><pre class="tbl">' + esc(r.body) + "</pre></div>";
  } else {
    const a = d.조문[r.i];
    h += '<div class="art">';
    if (a.본문) h += "<p" + (a.삭제 ? ' class="del"' : "") + ">" + articleText(a.본문, r, "본문") + "</p>";
    (a.항 || []).forEach((hg, n) => {
      h += '<div class="hang">';
      if (hg.내용) h += "<p>" + (hg.번호 ? '<span class="hn">' + esc(hg.번호) + "</span>" : "") + articleText(hg.내용, r, "항" + n) + "</p>";
      else if (hg.번호) h += '<p><span class="hn">' + esc(hg.번호) + "</span></p>";
      (hg.호 || []).forEach((x, i) => { h += '<div class="ho">' + articleText(x, r, "항" + n + "호" + i) + "</div>"; });
      h += "</div>";
      /* 그 항을 어겼을 때 따라오는 것 — 다음 항으로 넘어가기 전에 붙인다 */
      h += penHTML(((a.벌 || {}).항 || {})[n + 1], d);
    });
    /* 조 전체에 걸리는 것은 어느 항의 몫으로 읽히면 안 되므로 맨 아래에 둔다 */
    h += penHTML((a.벌 || {}).끝, d);
    if (a.참고) h += '<div class="moved">' + linkify(esc(a.참고), r.d) + "</div>";
    if (!a.본문 && !(a.항 || []).length && !a.참고) h += '<p class="del">본문이 없는 조문입니다.</p>';
    h += "</div>";
  }

  const sib = RECS.filter(x => x.d === r.d && x.kind === r.kind);
  const at = sib.indexOf(r);
  h += '<div class="rfoot">' +
    '<button id="prev"' + (at <= 0 ? " disabled" : "") + '>← 이전</button>' +
    '<a href="' + esc(d.링크) + '" target="_blank" rel="noopener">원문 확인</a>' +
    '<button id="next"' + (at >= sib.length - 1 ? " disabled" : "") + '>다음 →</button></div>';
  h += '<div class="note">' + esc(d.법령구분 || "") + " · " + esc(d.법령번호 || "") + " · " + esc(d.소관부처 || "") + "<br>국가법령정보센터 원문을 그대로 담았습니다. 법적 효력은 원문에 있으며, 개정 여부는 “원문 확인”으로 확인하세요.</div>";
  h += "</div>";
  $("#rbody").innerHTML = h;
  paintHL();
  $("#rbody").scrollTop = 0;
  $("#reader").hidden = false;
  document.body.style.overflow = "hidden";

  recent = [key].concat(recent.filter(k => k !== key)).slice(0, 30);
  store.set("recent", recent);
  $("#prev") && ($("#prev").onclick = () => openRec(sib[at - 1].key, "sib"));
  $("#next") && ($("#next").onclick = () => openRec(sib[at + 1].key, "sib"));
  $("#rbody").querySelectorAll("[data-pen]").forEach(b => b.onclick = () => {
    const ul = $("#" + b.dataset.pen);
    ul.hidden = !ul.hidden;
    b.textContent = ul.hidden ? "경우별로 보기 ▸" : "접기 ▾";
  });
  $("#rbody").querySelectorAll("[data-z]").forEach(b => b.onclick = () => {
    const cs = parseFloat(getComputedStyle($("#rbody").querySelector(".tbl")).fontSize);
    const nv = Math.max(8, Math.min(22, cs + (+b.dataset.z)));
    document.documentElement.style.setProperty("--tblsize", nv + "px");
    store.set("tblsize", nv);
  });
}


/* ---------------- 제12장 벌칙·과태료 ----------------
   조문을 어겼을 때 무엇이 따라오는지는 조문 옆에 있어야 쓸모가 있다. 제12장을
   찾아가 다시 읽는 일을 없앤다. 과태료는 1·2·3차로 갈리고, 경우에 따라 또 갈리는
   것이 있어(제15조·제42조 등) 그런 것은 한 줄로 접어 두고 눌러서 펼친다. */
function penHTML(list, d) {
  if (!list || !list.length) return "";
  return list.map(it => {
    if (it.t === "벌") {
      return '<div class="pen"><span class="tag">형벌</span>' + esc(it.형) +
        (it.한정 ? ' <span class="lim">(' + esc(it.한정) + "에 한정)</span>" : "") +
        (it.때 ? ' <span class="lim">— ' + esc(it.때) + " 경우</span>" : "") +
        '<span class="src">' + esc(it.근거) + "</span></div>";
    }
    /* 무엇을 했을 때 물리는지를 밝힌다 — 금액만 있으면 남 얘기처럼 읽힌다 */
    const head = '<div class="pen"><span class="tag fine">과태료</span>' +
      (it.때 ? '<span class="when">' + esc(it.때) + "</span>" : "");
    if (it.돈) {
      return head + chaHTML(it.돈) + '<span class="src">' + esc(it.근거) + "</span></div>";
    }
    const id = "pen" + (penSeq++);
    return head + esc(penSum(it.때들)) +
      '<button class="open" data-pen="' + id + '">경우별로 보기 ▸</button>' +
      '<ul id="' + id + '" hidden>' + it.때들.map(c =>
        '<li><span class="w">' + esc(c.때) + "</span>" + chaHTML(c.돈) + "</li>").join("") +
      '</ul><span class="src">' + esc(it.근거) + "</span></div>";
  }).join("");
}
let penSeq = 0;

function chaHTML(m) {
  return ["1차", "2차", "3차"].map((n, i) =>
    "(" + n + ') <span class="cha">' + esc(m[i] || "-") + "</span>").join(" / ");
}

/* 접어 둘 때 보여 줄 한 줄 — 경우마다 금액이 다르니 폭으로 알린다 */
function penSum(cases) {
  const nums = [];
  let prose = false;
  for (const c of cases) for (const v of c.돈) {
    const m = /^([\d,]+)만원$/.exec(v || "");
    if (m) nums.push(+m[1].replace(/,/g, ""));
    else if (v) prose = true;   /* 공사금액의 100분의 5 처럼 글로 된 금액 */
  }
  /* 글로 된 금액이 섞이면 폭으로 알릴 수 없다. 없는 셈 치고 범위를 내면 거짓이 된다 */
  if (prose || !nums.length) return "경우에 따라 다릅니다";
  const lo = Math.min(...nums), hi = Math.max(...nums);
  const f = n => n.toLocaleString() + "만원";
  return "경우에 따라 " + (lo === hi ? f(lo) : f(lo) + "~" + f(hi));
}

/* 결과 화면 맨 위의 '저장한 조문' 줄만 손본다. 목록을 통째로 다시 그리면
   보던 자리에서 맨 위로 튀어 버려, 찾던 것을 놓친다. */
function syncSaveGo() {
  const v = $("#v-search");
  if (!v || tab !== "search" || !$("#q").value.trim()) return;
  const n = saved.filter(k => BYKEY.has(k)).length;
  let el = $("#savego");
  if (!n) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement("button");
    el.className = "savego";
    el.id = "savego";
    v.insertBefore(el, v.firstChild);
  }
  el.innerHTML = STAR + "<span>저장한 조문 " + n + "</span>" + ARW;
}

function hideReader() {
  $("#reader").hidden = true;
  cur = null; delegation = null;
  document.body.style.overflow = "";
  /* 조문을 보고 나오면 첫 화면의 '최근 본 조문'이 바로 반영돼야 한다 */
  if (tab === "search" && !$("#q").value.trim()) renderSearch();
  else syncSaveGo();   /* 결과를 보던 중이면 목록은 두고 저장 줄만 맞춘다 */
}

/* ---------------- 뒤로가기 ----------------
   탭 · 목차 위치 · 보고 있는 조문을 히스토리 한 항목에 하나씩 대응시킨다.
   홈 화면에 설치하면 브라우저 뒤로가기 버튼이 없어서, 왼쪽 끝을 쓸어넘기는
   제스처가 유일한 뒤로가기다. 그래서 온 길이 전부 히스토리에 남아 있어야 한다. */
function snapshot() {
  return { t: tab, doc: idxDoc, adv: advPage, key: (cur && !$("#reader").hidden) ? cur.key : null,
    delegate: delegation, dq: $("#delegateq")?.value || "" };
}

/* 히스토리를 건드리지 않고 그 상태로 되돌린다. 안 바뀐 것은 다시 그리지 않는다
   (조문에서 빠져나올 때 목록이 맨 위로 튀지 않게). */
function applyView(v) {
  const tabChanged = tab !== v.t, docChanged = idxDoc !== v.doc;
  const advChanged = advPage !== (v.adv || null);
  idxDoc = v.doc;
  advPage = v.adv || null;
  if (tabChanged) setTab(v.t);
  else if (docChanged && v.t === "index") renderIndex();
  else if (advChanged && v.t === "adv") renderAdv();
  if (v.key) {
    showRec(v.key);
    if (v.delegate != null) showDelegation(v.delegate, v.dq || "");
  }
  else if (!$("#reader").hidden) hideReader();
}

/* 앞으로 한 걸음. 뒤로가기 한 번이 정확히 이만큼 되돌린다. */
function go(v) {
  views.push(v);
  history.pushState({ i: views.length - 1 }, "", "");
  applyView(v);
}

/* mode 는 예전 호출부와 시험 스크립트 때문에 남겨 둔다. 이제 모두 같게 다룬다. */
function openRec(key, mode) {
  if (!BYKEY.get(key)) return;
  go({ t: tab, doc: idxDoc, key: key });
}

/* ---------------- 배선 ---------------- */
function syncChips() {
  $(".chips").style.display = (tab === "search" && $("#q").value.trim()) ? "" : "none";
}

function setTab(t) {
  tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#v-search").hidden = t !== "search";
  $("#v-index").hidden = t !== "index";
  $("#v-adv").hidden = t !== "adv";
  syncChips();
  if (t === "index") renderIndex();
  if (t === "adv") renderAdv();
  window.scrollTo(0, 0);
}

let timer = null;
function onQuery() {
  const q = $("#q").value;
  $("#clear").classList.toggle("on", !!q);
  clearTimeout(timer);
  timer = setTimeout(() => {
    shown = 60;
    hits = search(q);
    if (tab !== "search") setTab("search");
    syncChips();
    renderSearch();
  }, q.length <= 1 ? 220 : 110);
}

/* ---------------- 얼마나 쓰이는지 세기 ----------------
   앱에 추적 도구를 넣지 않는다. 대신 Firestore 문서 하나의 숫자를 올린다.
   보내는 것은 **숫자를 올려 달라는 말 한 마디뿐**이다 — 누가, 어디서, 무엇을
   봤는지는 보내지 않는다. 기기를 가리는 번호조차 서버로 가지 않는다.

     stats/daily-2026-09-02   그날 앱을 연 기기 수
     stats/install            홈 화면 앱으로 처음 열린 횟수

   같은 기기가 하루에 여러 번 열어도 한 번만 센다. 그 판정은 기기 안에서 한다.
   저장이 막힌 기기(사생활 보호 모드)는 아예 세지 않는다 — 열 때마다 보내면
   숫자가 부풀어 오히려 못 믿을 것이 된다.

   FB 가 비어 있으면 아무 일도 하지 않는다. 설정 전에도 앱은 그대로 돈다. */
const FB = { project: "industrial-safety-law-app",
             key: "AIzaSyBYl4dZZvZCIFwQ2ybgDh_plwj6VO4IL6M" };

function bump(doc) {
  if (!FB.project || !FB.key || !navigator.onLine) return;
  const path = "projects/" + FB.project + "/databases/(default)/documents/stats/" + doc;
  fetch("https://firestore.googleapis.com/v1/projects/" + FB.project +
        "/databases/(default)/documents:commit?key=" + FB.key, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ writes: [{
      update: { name: path },
      updateMask: { fieldPaths: [] },
      updateTransforms: [{ fieldPath: "n", increment: { integerValue: "1" } }]
    }] })
  }).catch(() => {});   /* 못 보내도 그만이다. 앱이 하려던 일과 상관없다 */
}

function count() {
  /* 저장이 되는 기기에서만 센다. 안 되면 조용히 넘어간다 */
  store.set("_t", 1);
  if (store.get("_t", null) === null) return;

  const today = new Date().toISOString().slice(0, 10);
  if (store.get("day", "") !== today) { store.set("day", today); bump("daily-" + today); }

  /* 홈 화면 앱으로 처음 열렸을 때가 곧 설치를 마친 때다. 아이폰에도 통한다 —
     사파리는 설치 사건을 알려 주지 않지만, 홈 화면에서 열렸는지는 알 수 있다. */
  if (installed() && !store.get("inst", false)) { store.set("inst", true); bump("install"); }
}



/* ---------------- 홈 화면에 추가 권함 ----------------
   브라우저 탭으로 열면 사파리가 이레 뒤 저장한 것을 지운다. 홈 화면에 두면 그 앱만의
   자리를 갖게 되어 지워지지 않고, 오프라인도 더 든든하다. 그래서 권한다.

   이미 홈 화면에서 열고 있으면 띄우지 않는다 — 그 사람에게는 잔소리다.
   한 번 물리면 다시 묻지 않는다. 안드로이드·PC 크롬은 앱이 설치 창을 직접 띄울 수
   있지만(beforeinstallprompt), 아이폰 사파리는 그런 길이 없어 방법만 일러 준다. */
let instPrompt = null, instDone = false;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); instPrompt = e; });

function installed() {
  return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function maybeInstall() {
  /* 홈 화면에서 열고 있으면 묻지 않는다. 그 밖에는 열 때마다 묻는다 —
     한 번 물리고 마는 것보다, 쓰다가 마음이 바뀌는 쪽이 잦다. */
  if (installed() || instDone) return;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const how = ios
    ? '사파리 아래 <b>공유</b> 단추를 누르고 <b>「홈 화면에 추가」</b>를 고르세요.'
    : instPrompt
      ? '아래 <b>설치</b>를 누르면 끝납니다.'
      : '브라우저 메뉴(<b>⋮</b>)에서 <b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b>를 고르세요.';
  $("#insthow").innerHTML = how;
  $("#instgo").hidden = !instPrompt;
  $("#install").hidden = false;

  /* 물리면 이번에만 닫는다. 다음에 열면 다시 묻는다. */
  $("#instno").onclick = () => { $("#install").hidden = true; };
  $("#instgo").onclick = async () => {
    $("#install").hidden = true;
    try {
      instPrompt.prompt();
      const r = await instPrompt.userChoice;
      /* 정말 설치했다면 이 창에서도 더 묻지 않는다 */
      if (r && r.outcome === "accepted") instDone = true;
    } catch (e) {}
    instPrompt = null;
  };
}

function start() {
  const groups = ["전체"].concat([...new Set(DOCS.map(d => d.군))]);
  $("#chips").innerHTML = groups.map(g =>
    '<button class="chip" data-g="' + esc(g) + '" aria-pressed="' + (g === "전체") + '">' + esc(g) + "</button>").join("");
  NEWEST = DOCS.map(d => d.시행일).sort().slice(-1)[0] || "";
  BASIS = DOCS.map(d => d.수집일).filter(Boolean).sort().slice(-1)[0] || "";
  $("#stamp").textContent = BASIS ? "업데이트 " + BASIS : "오프라인";
  const z = store.get("tblsize", 0);
  if (z) document.documentElement.style.setProperty("--tblsize", z + "px");
  const th = store.get("theme", null);
  if (th) document.documentElement.setAttribute("data-theme", th);

  $("#q").addEventListener("input", onQuery);
  $("#clear").onclick = () => { $("#q").value = ""; $("#q").focus(); onQuery(); };
  $("#theme").onclick = () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    const nv = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nv);
    store.set("theme", nv);
  };
  $("#chips").onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.g;
    $("#chips").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    shown = 60; hits = search($("#q").value); renderSearch();
  };
  document.querySelectorAll("nav.tabs button").forEach(b =>
    b.onclick = () => { if (tab !== b.dataset.tab) go({ t: b.dataset.tab, doc: idxDoc, adv: advPage, key: null }); });
  document.addEventListener("click", e => {
    const delegate = e.target.closest("[data-delegate]");
    if (delegate && cur) { go({ ...snapshot(), delegate: +delegate.dataset.delegate, dq: "" }); return; }
    const k = e.target.closest("[data-key]");
    if (k) { openRec(k.dataset.key, e.target.closest(".ref") ? "ref" : "new"); return; }
    const g = e.target.closest("[data-tab-go]");
    if (g) { go({ t: g.dataset.tabGo, doc: idxDoc, adv: advPage, key: null }); return; }
    const d = e.target.closest("[data-doc]");
    if (d) { go({ t: "index", doc: +d.dataset.doc, adv: advPage, key: null }); return; }
    if (e.target.closest("#idxback")) {
      /* 빵부스러기는 늘 법령 목록으로 간다. 들어온 길을 그대로 되짚을 수 있을 때만 뒤로가기를
         쓰고(히스토리가 안 늘어난다), 아니면 목록으로 새로 이동한다. */
      const st = history.state, prev = st && views[st.i - 1];
      if (prev && prev.t === "index" && prev.doc === null && !prev.key) history.back();
      else go({ t: "index", doc: null, adv: advPage, key: null });
      return;
    }
    const ag = e.target.closest("[data-adv-go]");
    if (ag) { go({ t: "adv", doc: idxDoc, adv: ag.dataset.advGo, key: null }); return; }
    if (e.target.closest("#advback")) {
      /* 목차의 빵부스러기와 같게 — 되짚을 수 있으면 뒤로가기, 아니면 첫 화면으로 새로 간다 */
      const st2 = history.state, p2 = st2 && views[st2.i - 1];
      if (p2 && p2.t === "adv" && !p2.adv && !p2.key) history.back();
      else go({ t: "adv", doc: idxDoc, adv: null, key: null });
      return;
    }
    if (e.target.closest("#savego")) {
      $("#q").value = "";
      onQuery();
      window.scrollTo(0, 0);
      return;
    }
    if (e.target.closest("#savefold")) {
      savedOpen = !savedOpen;
      store.set("savedOpen", savedOpen);
      renderSearch();
      return;
    }
    if (e.target.closest("#more")) { shown += 100; renderSearch(); return; }
  });
  $("#rback").onclick = () => history.back();
  $("#rhl").onclick = clearHL;
  $("#rstar").onclick = () => {
    if (!cur) return;
    const had = saved.includes(cur.key);
    saved = had ? saved.filter(k => k !== cur.key) : [cur.key].concat(saved);
    store.set("saved", saved);
    $("#rstar").classList.toggle("on", saved.includes(cur.key));
    $("#rstar").querySelector("svg").setAttribute("fill", saved.includes(cur.key) ? "currentColor" : "none");
    /* 눌러도 화면이 그대로면 저장이 됐는지 알 수 없다. 저장한 곳도 함께 일러 준다.
       localStorage 가 막힌 기기(사생활 보호 모드 등)에서는 그 사실을 알려야 한다. */
    if (store.get("saved", null) === null) toast("이 기기에서는 저장이 되지 않습니다. 브라우저의 사생활 보호 모드를 꺼 주세요.", 6000);
    else toast(had ? "저장을 풀었습니다" : "저장했습니다 · 검색을 비우면 첫 화면에서 볼 수 있습니다");
    syncSaveGo();
  };
  addEventListener("popstate", e => {
    const i = e.state && typeof e.state.i === "number" ? e.state.i : 0;
    applyView(views[i] || { t: "search", doc: null, key: null });
  });
  addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("#reader").hidden) history.back();
    if (e.key === "/" && !e.target.closest("input,textarea")) { e.preventDefault(); $("#q").focus(); }
  });

  syncChips();
  renderSearch();
  views = [snapshot()];
  history.replaceState({ i: 0 }, "", "");
  $("#boot").remove();
  $("#app").hidden = false;
  maybeInstall();
  count();
}

let toastTimer = null;
window.toast = (msg, ms) => {
  const el = $("#toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms || 4000);
};

boot().catch(e => {
  const tip = location.protocol === "file:" ? "" : "<br>인터넷에 한 번 연결한 상태로 다시 열어 주세요.";
  $("#boot").innerHTML = '<div class="in"><h2>원문을 여는 데 실패했습니다</h2><p>' + esc(e.message) + tip + "</p></div>";
});
</script>
